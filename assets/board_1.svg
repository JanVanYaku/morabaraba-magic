    <circle cx="15" cy="160" r="5"/><circle cx="305" cy="160" r="5"/>
    <circle cx="15" cy="305" r="5"/><circle cx="160" cy="305" r="5"/><circle cx="305" cy="305" r="5"/>
    <circle cx="63" cy="63" r="5"/><circle cx="160" cy="63" r="5"/><circle cx="257" cy="63" r="5"/>
    <circle cx="63" cy="160" r="5"/><circle cx="257" cy="160" r="5"/>
    <circle cx="63" cy="257" r="5"/><circle cx="160" cy="257" r="5"/><circle cx="257" cy="257" r="5"/>
    <circle cx="112" cy="112" r="5"/><circle cx="160" cy="112" r="5"/><circle cx="208" cy="112" r="5"/>
    <circle cx="112" cy="160" r="5"/><circle cx="160" cy="160" r="5"/><circle cx="208" cy="160" r="5"/>
    <circle cx="112" cy="208" r="5"/><circle cx="160" cy="208" r="5"/><circle cx="208" cy="208" r="5"/>
