<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Morabaraba Board 1</title>
  <desc id="desc">Twenty-five point Koti or Sesotho style Morabaraba board with an active centre cross.</desc>
  <rect width="320" height="320" fill="#f5dda1"/>
  <g stroke="#302015" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="15" y="15" width="290" height="290"/>
    <rect x="63" y="63" width="194" height="194"/>
    <rect x="112" y="112" width="96" height="96"/>
    <line x1="160" y1="15" x2="160" y2="112"/>
    <line x1="305" y1="160" x2="208" y2="160"/>
    <line x1="160" y1="305" x2="160" y2="208"/>
    <line x1="15" y1="160" x2="112" y2="160"/>
    <line x1="112" y1="160" x2="208" y2="160"/>
    <line x1="160" y1="112" x2="160" y2="208"/>
    <line x1="15" y1="15" x2="63" y2="63"/>
    <line x1="305" y1="15" x2="257" y2="63"/>
    <line x1="305" y1="305" x2="257" y2="257"/>
    <line x1="15" y1="305" x2="63" y2="257"/>
  </g>
  <g fill="#302015">
